<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VetNexa — Animal Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="padding:24px;background:var(--bg)">
  <div style="max-width:980px;margin:0 auto">
    <div style="display:flex;gap:16px;align-items:center">
      <div style="width:120px;height:120px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)">Photo</div>
      <div>
        <h3>Cow — A123</h3>
        <div style="color:var(--muted)">Status: <span style="color:var(--danger);font-weight:700">High Risk</span></div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 320px;gap:16px;margin-top:16px">
      <div>
        <div class="card"><strong>Details</strong><div style="display:flex;gap:12px;margin-top:8px"><div>Age: 4</div><div>Gender: Female</div><div>Owner: John Doe</div></div></div>
        <div class="card" style="margin-top:12px"><strong>Health Timeline</strong>
          <ol style="margin-top:8px;color:var(--muted)">
            <li>Registered — 2025-01-03</li>
            <li>Vaccinated — 2025-11-12</li>
            <li>Health Report — 2026-08-28</li>
            <li>Veterinary Review — Pending</li>
          </ol>
        </div>
      </div>
      <aside>
        <div class="card"><strong>Quick Actions</strong><div style="margin-top:8px;display:flex;flex-direction:column;gap:8px"><button class="btn btn-primary">Assign Vet</button><button class="btn btn-ghost">Add Note</button></div></div>
      </aside>
    </div>
  </div>
  <script src="scripts.js"></script>
</body>
</html>
