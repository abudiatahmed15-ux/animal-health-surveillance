<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VetNexa — Report Details</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="padding:48px;background:var(--bg)">
  <div style="max-width:760px;margin:0 auto">
    <h2>Report Details</h2>
    <p style="color:var(--muted)">This page previews the saved report (demo uses localStorage).</p>

    <div class="card" style="margin-top:18px;text-align:center">
      <div id="photoWrap" style="display:none">
        <h4>Uploaded Photo</h4>
        <img id="photo" src="" alt="Uploaded" style="max-width:480px;border-radius:8px;box-shadow:var(--shadow);margin-top:12px" />
      </div>
      <div id="noPhoto" style="color:var(--muted);margin:24px 0">No photo was uploaded for this report.</div>

      <div style="margin-top:18px;display:flex;gap:12px;justify-content:center">
        <a class="btn btn-ghost" href="report-form.html">Edit Report</a>
        <button id="clearBtn" class="btn btn-ghost">Clear Saved Photo</button>
        <a class="btn btn-primary" href="landing.html">Return to Dashboard</a>
      </div>
    </div>
  </div>

  <script>
  document.addEventListener('DOMContentLoaded', ()=>{
    const data = localStorage.getItem('reportImage');
    const img = document.getElementById('photo');
    const wrap = document.getElementById('photoWrap');
    const noPhoto = document.getElementById('noPhoto');
    if(data){ img.src = data; wrap.style.display = 'block'; noPhoto.style.display = 'none'; }
    else { wrap.style.display = 'none'; noPhoto.style.display = 'block'; }

    document.getElementById('clearBtn').addEventListener('click', ()=>{ localStorage.removeItem('reportImage'); alert('Saved photo cleared'); window.location.reload(); });
  });
  </script>
</body>
</html>
