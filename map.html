<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VetNexa — Map</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="vn-navbar"><div class="left"><img src="../design/logo.svg" height="36"></div><div><input placeholder="Search village, district or location..." style="padding:10px;border-radius:8px;border:1px solid #E8EEF1;width:360px"/></div></header>
  <main class="map-screen">
    <div style="padding:18px;display:flex;gap:12px">
      <div style="flex:1;border-radius:12px;overflow:hidden" class="card">[Light map placeholder — markers: green/yellow/red]</div>
      <aside style="width:360px">
        <div class="card"><strong>Health Hotspots</strong><div style="margin-top:8px">🚨 Potential Health Cluster<br/>Village XYZ — 18 Reports — HIGH RISK</div><div style="margin-top:12px"><a class="btn btn-primary">View Area</a></div></div>
      </aside>
    </div>
  </main>
  <script src="scripts.js"></script>
</body>
</html>
