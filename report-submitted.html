<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VetNexa — Report Submitted</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="padding:48px;background:var(--bg)">
  <div style="max-width:700px;margin:0 auto;text-align:center">
    <div style="width:140px;height:140px;margin:0 auto;background:linear-gradient(90deg,var(--primary),var(--secondary));border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);">
      <svg width="70" height="70" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h2 style="margin-top:18px">Report Submitted Successfully</h2>
    <p style="color:var(--muted)">Your livestock health report has been recorded.</p>

    <div class="card" style="margin-top:18px">
      <h4>Risk Assessment</h4>
      <div style="display:flex;align-items:center;gap:18px;justify-content:center">
        <div style="width:140px;height:140px;border-radius:50%;background:conic-gradient(var(--danger) 0 82%, #e6f3ee 82% 100%);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--text);">82</div>
        <div style="text-align:left">
          <div style="font-weight:700;color:var(--danger)">HIGH RISK</div>
          <div style="color:var(--muted);margin-top:6px">Veterinary examination recommended.</div>
        </div>
      </div>
      <div style="display:flex;gap:12px;justify-content:center;margin-top:16px"><a class="btn btn-primary" href="report-details.html">View Report</a><a class="btn btn-ghost" href="landing.html">Return to Dashboard</a></div>
      <div id="uploadedPhotoWrap" style="margin-top:18px;display:none;text-align:center">
        <h4>Uploaded Photo</h4>
        <img id="uploadedPhoto" src="" alt="Uploaded photo" style="max-width:320px;border-radius:8px;box-shadow:var(--shadow);margin-top:8px" />
      </div>
    </div>
  </div>
  <script src="scripts.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', ()=>{
    const img = document.getElementById('uploadedPhoto');
    const wrap = document.getElementById('uploadedPhotoWrap');
    try{
      const data = localStorage.getItem('reportImage');
      if(data && img && wrap){ img.src = data; wrap.style.display = 'block'; }
      else if(wrap){ wrap.style.display = 'none'; }
    }catch(e){ if(wrap) wrap.style.display = 'none'; }
  });
  </script>
</body>
</html>
